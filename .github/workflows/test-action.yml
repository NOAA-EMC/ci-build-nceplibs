name: 'CI: Test ci-build-nceplibs action'

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 25 * *'

jobs:
  test-develop-builds:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout action repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gfortran libpng-dev libjpeg-dev libopenblas-serial-dev openmpi-bin libopenmpi-dev
      
      - name: First run - Build all packages (develop versions, no cache)
        id: first-run
        uses: ./
        with:
          jasper-version: master
          bacio-version: develop
          bufr-version: develop
          g2-version: develop
          g2c-version: develop
          ip-version: develop
          nemsio-version: develop
          sp-version: develop
          w3emc-version: develop
          repo-cache: false
          key-prefix: test-
      
      - name: Verify libraries exist (first run)
        run: |
          set -x
          echo "Checking for installed libraries..."
          test -f ${{ github.workspace }}/nceplibs/jasper/lib/libjasper.so
          test -f ${{ github.workspace }}/nceplibs/NCEPLIBS-bacio/lib/libbacio.a
          test -f ${{ github.workspace }}/nceplibs/NCEPLIBS-bufr/lib/libbufr_4.a
          test -f ${{ github.workspace }}/nceplibs/NCEPLIBS-sp/lib/libsp_d.a
          test -f ${{ github.workspace }}/nceplibs/NCEPLIBS-w3emc/lib/libw3emc_d.a
          test -f ${{ github.workspace }}/nceplibs/NCEPLIBS-ip/lib/libip_d.a
          test -f ${{ github.workspace }}/nceplibs/NCEPLIBS-g2c/lib/libg2c.a
          test -f ${{ github.workspace }}/nceplibs/NCEPLIBS-g2/lib/libg2_d.a
          test -f ${{ github.workspace }}/nceplibs/NCEPLIBS-nemsio/lib/libnemsio.a
          echo "All library checks completed successfully!"
    
